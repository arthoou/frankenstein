name: Build FrankenApp executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: FrankenApp-linux
            add_data_sep: ":"
          - os: windows-latest
            artifact: FrankenApp-windows
            add_data_sep: ";"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build standalone executable
        run: >
          pyinstaller --onefile --windowed --name FrankenApp
          --add-data "stages${{ matrix.add_data_sep }}stages"
          app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/FrankenApp
            dist/FrankenApp.exe
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into release-ready files
        run: |
          mkdir -p release
          cp artifacts/FrankenApp-linux/FrankenApp release/FrankenApp-linux
          chmod +x release/FrankenApp-linux
          cp artifacts/FrankenApp-windows/FrankenApp.exe release/FrankenApp-windows.exe

      - name: Create GitHub release with executables attached
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
